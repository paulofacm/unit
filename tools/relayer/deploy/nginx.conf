server {
  listen 80;
  server_name relayer.unit.example;

  # Redirect HTTP to HTTPS in production
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  server_name relayer.unit.example;

  ssl_certificate /etc/ssl/certs/unit.crt; # replace with real cert
  ssl_certificate_key /etc/ssl/private/unit.key;

  location / {
    proxy_pass http://127.0.0.1:8080; # relayer listens on port 8080 by default
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
