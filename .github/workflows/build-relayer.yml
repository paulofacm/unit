name: Build Relayer Binaries

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    # Secrets used by this workflow (if present):
    # - GPG_PRIVATE_KEY : ASCII-armored private key (exported via `gpg --armor --export-secret-keys <KEY_ID>`)
    # - GPG_PASSPHRASE  : Passphrase for the private key (optional; used when the key is passphrase-protected)
    # These secret names match the README and the helper `scripts/build_release.sh`.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies (use npm ci if lockfile present)
        run: |
          cd tools/relayer
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            echo "Lockfile found, running npm ci"
            npm ci
          else
            echo "No lockfile found, running npm install"
            npm install
          fi

      - name: Build all binaries
        working-directory: tools/relayer
        run: npm run build:all

      - name: Create checksums
        working-directory: tools/relayer
        run: |
          mkdir -p dist
          if [ -d dist ]; then ls dist || true; fi
          cd dist
          for f in *; do sha256sum "$f" >> ../dist/CHECKSUMS || true; done
          cd ..

      - name: Optional GPG sign checksums
        if: ${{ secrets.GPG_PRIVATE_KEY != '' && secrets.GPG_PASSPHRASE != '' }}
        working-directory: tools/relayer
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          # Import private key into a temporary GNUPGHOME to avoid polluting runner keyring
          TMPGPG=$(mktemp -d)
          export GNUPGHOME="$TMPGPG"
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          # Sign each artifact in dist/ and the CHECKSUMS file (detached signature)
          for f in dist/*; do
            if [ -f "$f" ]; then
              gpg --batch --yes --passphrase "$GPG_PASSPHRASE" --pinentry-mode loopback --output "$f.sig" --detach-sign "$f" || true
            fi
          done
          if [ -f dist/CHECKSUMS ]; then
            gpg --batch --yes --passphrase "$GPG_PASSPHRASE" --pinentry-mode loopback --output dist/CHECKSUMS.sig --sign dist/CHECKSUMS || true
          fi
          # cleanup
          rm -rf "$TMPGPG"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: relayer-binaries
          path: |
            tools/relayer/dist
            tools/relayer/dist/CHECKSUMS

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: relayer-binaries

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release assets
        uses: softprops/action-gh-release@v1
        with:
          files: 'tools/relayer/dist/**'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
